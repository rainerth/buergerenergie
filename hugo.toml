baseURL = 'https://www.buergerenergie-bhz.de'
languageCode = 'de'
title = 'Bürgerenergie Bösingen-Herrenzimmern eG i.G.'
theme = 'hugo-theme-cleanwhite'
copyright = 'Bürgerenergie Bösingen-Herrenzimmern eG i.G.'

#frontpage pagination
[pagination]
pagerSize = 10

enableRobotsTXT = true
buildFuture = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Image-Processing-Defaults (greift bei Resource.Resize / .Fit / .Fill / .Process)
[imaging]
  quality = 85
  resampleFilter = "Lanczos"
  anchor = "Smart"
  hint = "photo"
  bgColor = "#ffffff"

[outputs]
home = ["HTML", "RSS"]


[params]
	# Hero Image Configuration - WebP optimiert
	header_image = "img/buergerenergie-boesingen-106063041-hero.webp"
	# Fallback für ältere Browser (optional)
	header_image_fallback = "img/buergerenergie-boesingen-106063041-hero.png"

	slogan = "Energie in Bürgerhand"
	SEOTitle = "Bürgerenergie Bösingen-Herrenzimmern eG i.G."
	SEODescription = "Bürgerenergie 78662 Bösingen - Bürgerenergiegenossenschaft in Gründung"
	SEOKeywords = "Bürgerenergie, Energie, Klimaschutz, 78662 Bösingen"
	description = "Bürgerenergiegenossenschaft in Gründung"
	author = "Bürgerenergie Bösingen-Herrenzimmern eG i.G."
	keywords = "Bürgerenergie, Energie, Genossenschaft"

	logo = "img/buergerenergie-boesingen-logo.svg"
	favicon = "favicon-256x256.png"

	custom_css = ["css/buergerenergie.css"]

	image_404 = "img/404-bg.jpg"
	omit_categories = true

	# Sidebar settings
	sidebar_about_description = "Bürgerenergie Bösingen-Herrenzimmern eG i.G."
	sidebar_avatar = "img/buergerenergie-boesingen-logo.svg"

	featured_tags = false
	featured_condition_size = 1

	friends = false
	bookmarks = false
	about_me = true

	# Termine-Filterung: Wie viele Tage zurück sollen Termine angezeigt werden?
	termine_days_back = 60

	[[params.additional_menus]]
	title = "Neuigkeiten"
	href = "/neuigkeiten"

	[[params.additional_menus]]
	title = "Termine"
	href = "/termine"

	[[params.additional_menus]]
	title = "Dokumente"
	href = "/dokumente"

	[[params.additional_menus]]
	title = "FAQ"
	href = "/faq"

	[params.social]
	rss = true
	email = "info@buergerenergie-bhz.de"
	mastodon = "https://geno.social/@buergerenergie_bhz"
	instagram = "https://www.instagram.com/buergerenergie_boesingen/"

	# Search configuration
	search = true
	search_provider = "pagefind"
